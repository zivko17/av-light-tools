name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: linux (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: windows (test, release build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release -p avlt
      - name: Smoke test (net)
        shell: bash
        run: |
          target/release/avlt.exe net info --json
          target/release/avlt.exe net portscan 127.0.0.1 --json
      - name: Smoke test (sys, util)
        shell: bash
        run: |
          target/release/avlt.exe sys info --json
          target/release/avlt.exe sys disks --json
          target/release/avlt.exe sys startup --json
          target/release/avlt.exe util timer 1s
      - uses: actions/upload-artifact@v4
        with:
          name: avlt-windows-x64
          path: target/release/avlt.exe
          if-no-files-found: error
